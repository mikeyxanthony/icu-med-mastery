<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1f7" />
    <title>Pathology Study ✿ ICU Med Mastery</title>
    <meta name="description" content="Critical care pathology — coronary anatomy + MI mapping, heart sounds & murmurs, ARDS, sepsis, COPD, HCM. Visual, accurate, exportable to notes." />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ec4899'/%3E%3Cpath d='M32 50 C16 38 16 22 24 18 C28 16 32 18 32 22 C32 18 36 16 40 18 C48 22 48 38 32 50 Z' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <div class="page-header">
        <div>
          <h2 class="page-title"><span class="page-emoji">🫀</span>Pathology Study</h2>
          <div class="page-subtitle">cardiac · respiratory · sepsis — the conditions critical care nurses live with ✿</div>
        </div>
      </div>

      <nav class="modes" role="tablist">
        <button class="mode-tab active" data-view="view-coronary"><span class="icon">❤️</span>Coronary &amp; MI</button>
        <button class="mode-tab" data-view="view-sounds"><span class="icon">🎶</span>Heart Sounds &amp; Murmurs</button>
        <button class="mode-tab" data-view="view-conditions"><span class="icon">📋</span>Conditions</button>
      </nav>

      <main>
        <section id="view-coronary" class="view active"></section>
        <section id="view-sounds" class="view"></section>
        <section id="view-conditions" class="view"></section>
      </main>

      <footer>
        <div>references: AHA/ACC guidelines · Berlin ARDS criteria · Sepsis-3 · GOLD report · current critical care literature ✿</div>
        <div class="disclaimer">study tool only — clinical decisions belong to the team caring for the patient 💕</div>
      </footer>
    </div>

    <script src="./nav.js"></script>
    <script src="./clipboard.js"></script>
    <script src="./pathology-data.js"></script>
    <script src="./pathology.js"></script>
  </body>
</html>
